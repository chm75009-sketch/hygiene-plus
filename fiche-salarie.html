<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Fiche salarié</title>
<style>
  :root { --enc:#1e3a5f; --txt:#1c1f2e; --gris:#5b5e78; --bord:#d9dbe8; --fond:#f4f5fa; --rouge:#b91c1c; --vert:#15803d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fond); color:var(--txt); font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size:16px; line-height:1.45; }
  .wrap { max-width:560px; margin:0 auto; padding:16px 16px 48px; }
  .head { background:linear-gradient(135deg,#0f172a,#1e3a5f); color:#fff; border-radius:16px; padding:16px; margin-bottom:14px; }
  .head b { display:block; font-size:19px; }
  .head small { opacity:.8; }
  form, .carte { background:#fff; border:1px solid var(--bord); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  h2 { font-size:15px; margin:8px 0 0; color:var(--enc); text-transform:uppercase; letter-spacing:.03em; }
  label { display:flex; flex-direction:column; gap:4px; font-weight:600; font-size:14px; }
  label .et { color:var(--rouge); }
  input, select { font:inherit; padding:11px 12px; border:1px solid var(--bord); border-radius:10px; background:#fafbff; width:100%; }
  input:focus, select:focus { outline:2px solid #4338ca; border-color:#4338ca; }
  .note { font-size:13px; color:var(--gris); font-weight:400; }
  .photo { border:1px dashed var(--bord); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:6px; }
  .photo .ok { color:var(--vert); font-size:13px; font-weight:700; }
  .rgpd { border:2px solid var(--rouge); background:#fef2f2; border-radius:12px; padding:12px; font-size:13.5px; }
  .rgpd b.t { color:var(--rouge); display:block; font-size:15px; margin-bottom:4px; }
  .rgpd ul { margin:6px 0; padding-left:18px; }
  .coche { flex-direction:row; align-items:flex-start; gap:10px; font-weight:700; }
  .coche input { width:22px; height:22px; flex-shrink:0; margin-top:1px; }
  button { font:inherit; font-weight:800; border:none; border-radius:12px; padding:14px; background:#4338ca; color:#fff; cursor:pointer; font-size:16px; }
  button:disabled { opacity:.6; }
  .err { color:var(--rouge); font-weight:700; font-size:14px; min-height:1em; margin:0; }
  .grand { font-size:40px; text-align:center; margin:4px 0; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="carte"><p class="note">Chargement…</p></div></div>
<script>
(function () {
  var URL_SB = 'https://kiknaxuzpovvivkjqzss.supabase.co';
  var CLE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtpa25heHV6cG92dml2a2pxenNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NjQ3OTcsImV4cCI6MjA5MjQ0MDc5N30._LY5my720EJOo-9byuA65zVbUv7PsGeXUK_R2kzkxHA';
  var app = document.getElementById('app');
  var jeton = (new URLSearchParams(location.search).get('t') || '').replace(/[^a-f0-9]/gi, '');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function rpc(nom, p) {
    return fetch(URL_SB + '/rest/v1/rpc/' + nom, { method: 'POST', headers: { apikey: CLE, Authorization: 'Bearer ' + CLE, 'Content-Type': 'application/json' }, body: JSON.stringify(p) })
      .then(function (r) { return r.json(); });
  }
  function message(ico, titre, texte) {
    app.innerHTML = '<div class="carte"><p class="grand">' + ico + '</p><b style="font-size:18px;text-align:center">' + esc(titre) + '</b><p class="note" style="text-align:center">' + esc(texte) + '</p></div>';
  }
  var RAISONS = {
    lien_inconnu: ['⚠️', 'Lien non valable', 'Ce lien n\'existe pas. Demandez un nouveau lien à votre employeur.'],
    deja_rempli: ['✅', 'Fiche déjà envoyée', 'Cette fiche a déjà été remplie. Pour corriger une information, adressez-vous à votre employeur.'],
    expire: ['⌛', 'Lien expiré', 'Ce lien n\'est plus valable. Demandez un nouveau lien à votre employeur.']
  };

  // Champs dans le même ordre que la fiche salarié du dossier administratif
  var CHAMPS = [
    ['nom', 'Nom', 'text', true], ['prenom', 'Prénom', 'text', true],
    ['naissance_date', 'Date de naissance', 'date', true], ['naissance_lieu', 'Lieu de naissance (ville et pays)', 'text', true],
    ['nationalite', 'Nationalité', 'text', true], ['adresse', 'Adresse complète', 'text', true], ['telephone', 'Téléphone', 'tel', false],
    ['sexe', 'Sexe', 'select', true], ['nir', 'N° de sécurité sociale (15 chiffres, sur la carte Vitale)', 'text', false]
  ];
  var TITRE = [['titre_travail_type', 'Titre de séjour : type (ex. : carte de résident, carte pluriannuelle)', 'text'], ['titre_travail_num', 'Titre de séjour : numéro', 'text'], ['titre_sejour_fin', 'Titre de séjour : fin de validité', 'date']];
  var PHOTOS = [['id_recto', 'Pièce d\'identité ou passeport (recto)', 'Pièce d\'identité'], ['id_verso', 'Pièce d\'identité (verso)', 'Pièce d\'identité'],
    ['ts_recto', 'Titre de séjour (recto)', 'Titre de séjour'], ['ts_verso', 'Titre de séjour (verso)', 'Titre de séjour'], ['vitale', 'Carte Vitale', 'Carte Vitale']];
  var UE = ['francaise', 'francais', 'allemand', 'autrichien', 'belge', 'bulgare', 'chypriote', 'croate', 'danois', 'espagnol', 'estonien', 'finlandais', 'grec', 'hongrois', 'irlandais', 'italien', 'letton', 'lituanien', 'luxembourgeois', 'maltais', 'neerlandais', 'polonais', 'portugais', 'roumain', 'slovaque', 'slovene', 'suedois', 'tcheque', 'islandais', 'liechtensteinois', 'norvegien', 'suisse', 'france'];
  function sansAccent(t) { t = String(t || '').toLowerCase(); try { t = t.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) {} return t.trim(); }
  function horsUE(nat) { var n = sansAccent(nat); return !!n && !UE.some(function (x) { return n.indexOf(x) === 0; }); }
  function nirValide(v) {
    var n = String(v || '').replace(/\s/g, '').toUpperCase();
    if (!/^[12][0-9]{4}(2A|2B|[0-9]{2})[0-9]{6}[0-9]{2}$/.test(n)) return false;
    var base = n.slice(0, 13).replace('2A', '19').replace('2B', '18');
    var reste = 0; for (var i = 0; i < base.length; i++) reste = (reste * 10 + (+base[i])) % 97;
    return 97 - reste === +n.slice(13);
  }
  // Photo réduite à 1600 px (JPEG) ; un PDF est envoyé tel quel
  function lireFichier(f) {
    return new Promise(function (ok, ko) {
      var rd = new FileReader(); rd.onerror = function () { ko(new Error('lecture')); };
      if (/^image\//.test(f.type)) {
        rd.onload = function () {
          var img = new Image();
          img.onload = function () {
            var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
            c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            ok({ type: 'image/jpeg', b64: c.toDataURL('image/jpeg', 0.82).split(',')[1], nom: f.name.replace(/\.[^.]+$/, '') + '.jpg' });
          };
          img.onerror = function () { ko(new Error('image')); }; img.src = rd.result;
        };
      } else rd.onload = function () { ok({ type: f.type || 'application/pdf', b64: String(rd.result).split(',')[1], nom: f.name }); };
      rd.readAsDataURL(f);
    });
  }

  function formulaire(info) {
    var soc = info.societe || 'votre employeur';
    var h = '<div class="head"><b>Fiche salarié</b><small>' + esc(soc) + ' · à remplir par vous-même</small></div><form id="f" novalidate>'
      + '<p class="note" style="margin:0">Les champs marqués <b style="color:#b91c1c">*</b> sont obligatoires.</p><h2>Vos informations</h2>';
    CHAMPS.forEach(function (c) {
      var lab = esc(c[1]) + (c[3] ? ' <span class="et">*</span>' : ''), v = c[0] === 'nom' ? info.nom : (c[0] === 'prenom' ? info.prenom : '');
      if (c[2] === 'select') h += '<label for="c_' + c[0] + '"><span>' + lab + '</span><select id="c_' + c[0] + '"><option value="">—</option><option>Homme</option><option>Femme</option></select></label>';
      else h += '<label for="c_' + c[0] + '"><span>' + lab + '</span><input id="c_' + c[0] + '" type="' + c[2] + '" value="' + esc(v || '') + '"' + (c[0] === 'nir' ? ' inputmode="numeric" autocomplete="off"' : '') + (c[0] === 'telephone' ? ' autocomplete="tel"' : '') + '></label>';
    });
    h += '<div id="blocTitre" hidden style="display:flex;flex-direction:column;gap:12px"><h2>Titre de séjour</h2><p class="note" style="margin:0">Uniquement si vous n\'êtes pas citoyen de l\'Union européenne ou suisse.</p>';
    TITRE.forEach(function (c) { h += '<label for="c_' + c[0] + '">' + esc(c[1]) + '<input id="c_' + c[0] + '" type="' + c[2] + '"></label>'; });
    h += '</div><h2>Photos de vos documents</h2><p class="note" style="margin:0">Prenez en photo <b>uniquement vos documents</b>, bien à plat et lisibles.</p>';
    PHOTOS.forEach(function (p) {
      h += '<div class="photo" id="ph_' + p[0] + '"' + (p[2] === 'Titre de séjour' ? ' data-ts="1" hidden' : '') + '><label for="p_' + p[0] + '">' + esc(p[1]) + '<input id="p_' + p[0] + '" type="file" accept="image/*,application/pdf"></label><span class="ok" id="ok_' + p[0] + '"></span></div>';
    });
    h += '<div class="rgpd" role="note"><b class="t">Vos données personnelles</b>'
      + 'Les informations et documents de cette fiche sont transmis à <b>' + esc(soc) + '</b>, votre employeur, qui en est responsable. Ils servent uniquement à :'
      + '<ul><li>établir et suivre votre contrat de travail et vos bulletins de paie ;</li><li>faire les déclarations obligatoires (déclaration d\'embauche, URSSAF, médecine du travail) ;</li><li>tenir le registre unique du personnel.</li></ul>'
      + 'Ils sont accessibles à votre employeur et, si besoin, à son expert-comptable et aux organismes sociaux. Ils sont conservés pendant votre contrat puis pendant les durées fixées par la loi (5 ans après votre départ pour le registre du personnel).'
      + ' Vous pouvez demander à votre employeur d\'y accéder, de les corriger ou de les effacer quand la loi le permet, et saisir la CNIL (cnil.fr) en cas de difficulté.</div>'
      + '<label class="coche" for="c_rgpd"><input id="c_rgpd" type="checkbox"><span>J\'ai lu l\'information sur mes données personnelles <span class="et">*</span></span></label>'
      + '<p class="err" id="err" role="alert"></p><button type="submit" id="go">📤 Envoyer ma fiche</button></form>';
    app.innerHTML = h;
    var $ = function (id) { return document.getElementById(id); };
    function majTitre() {
      var hu = horsUE($('c_nationalite').value);
      $('blocTitre').hidden = !hu; $('blocTitre').style.display = hu ? 'flex' : 'none';
      document.querySelectorAll('[data-ts]').forEach(function (d) { d.hidden = !hu; });
    }
    $('c_nationalite').addEventListener('input', majTitre); majTitre();
    PHOTOS.forEach(function (p) {
      $('p_' + p[0]).addEventListener('change', function () { var f = this.files[0]; $('ok_' + p[0]).textContent = f ? '✓ ' + f.name : ''; });
    });
    $('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var err = $('err'), btn = $('go'); err.textContent = '';
      var d = {}; CHAMPS.concat(TITRE).forEach(function (c) { d[c[0]] = ($('c_' + c[0]).value || '').trim(); });
      if (!horsUE(d.nationalite)) TITRE.forEach(function (c) { d[c[0]] = ''; });
      var manque = CHAMPS.filter(function (c) { return c[3] && !d[c[0]]; });
      if (manque.length) { err.textContent = 'À remplir : ' + manque.map(function (c) { return c[1].replace(/ \(.*\)$/, ''); }).join(', ') + '.'; $('c_' + manque[0][0]).focus(); return; }
      if (d.nir) { d.nir = d.nir.replace(/\s/g, '').toUpperCase(); if (!nirValide(d.nir)) { err.textContent = 'Le n° de sécurité sociale ne semble pas correct : vérifiez les 15 chiffres de votre carte Vitale.'; $('c_nir').focus(); return; } }
      if (!$('c_rgpd').checked) { err.textContent = 'Cochez la case « J\'ai lu l\'information sur mes données personnelles ».'; $('c_rgpd').focus(); return; }
      d.rgpd = true;
      var choix = PHOTOS.filter(function (p) { var el = $('p_' + p[0]); return !$('ph_' + p[0]).hidden && el.files && el.files[0]; });
      btn.disabled = true; btn.textContent = 'Préparation des photos…';
      Promise.all(choix.map(function (p) { return lireFichier($('p_' + p[0]).files[0]).then(function (x) { return { categorie: p[2], titre: p[1], nom_fichier: x.nom, type_mime: x.type, taille: Math.round(x.b64.length * 0.75), contenu: x.b64 }; }); }))
        .then(function (pieces) {
          if (pieces.some(function (x) { return x.contenu.length > 9000000; })) throw new Error('trop_gros');
          btn.textContent = 'Envoi en cours…';
          return rpc('fiche_salarie_envoyer', { p_jeton: jeton, p_f: d, p_pieces: pieces });
        })
        .then(function (r) {
          if (r && r.ok) { message('✅', 'Merci, votre fiche est envoyée', 'Elle a été transmise à ' + soc + '. Vous pouvez fermer cette page.'); return; }
          var rs = r && RAISONS[r.raison]; if (rs) { message(rs[0], rs[1], rs[2]); return; }
          throw new Error((r && (r.raison || r.message)) || 'erreur');
        })
        .catch(function (x) {
          btn.disabled = false; btn.textContent = '📤 Envoyer ma fiche';
          err.textContent = x && x.message === 'trop_gros' ? 'Un fichier est trop lourd (6 Mo maximum). Envoyez une photo plutôt qu\'un PDF.' : 'L\'envoi n\'a pas abouti. Vérifiez votre connexion internet et réessayez.';
        });
    });
  }

  if (!jeton) { message('⚠️', 'Lien incomplet', 'Ouvrez le lien complet reçu de votre employeur.'); return; }
  rpc('fiche_salarie_ouvrir', { p_jeton: jeton }).then(function (r) {
    if (r && r.ok) return formulaire(r);
    var rs = r && RAISONS[r.raison];
    if (rs) message(rs[0], rs[1], rs[2]); else message('⚠️', 'Fiche indisponible', 'Réessayez dans quelques instants.');
  }, function () { message('📶', 'Pas de connexion', 'Vérifiez votre connexion internet puis rechargez la page.'); });
})();
</script>
</body>
</html>
